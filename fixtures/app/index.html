<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healwright Fixture Store</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="checkout-shell">
      <p class="eyebrow">Deterministic fixture store</p>
      <h1>Checkout</h1>

      <section aria-labelledby="order-summary-heading" class="order-summary">
        <h2 id="order-summary-heading">Order summary</h2>
        <div class="summary-row">
          <span>Field notebook</span>
          <span>$18.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>$18.00</span>
        </div>
      </section>

      <form id="checkout-form">
        <div class="field">
          <label for="cardholder-name">Cardholder name</label>
          <input id="cardholder-name" name="cardholderName" autocomplete="cc-name" required />
        </div>

        <div class="field">
          <label for="shipping-country">Shipping country</label>
          <select id="shipping-country" name="shippingCountry">
            <option value="US">United States</option>
            <option value="GB">United Kingdom</option>
            <option value="BG">Bulgaria</option>
          </select>
        </div>

        <label class="checkbox-row">
          <input data-testid="checkout-terms" name="terms" type="checkbox" required />
          <span>I agree to the store terms</span>
        </label>

        <button class="secondary-action" type="button">Apply discount</button>
        <button data-target="place-order" type="submit">Place order</button>
      </form>

      <output id="order-status" role="status" aria-live="polite"></output>
    </main>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Verify documentation links
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Verify package exports
        run: pnpm package:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify basic consumer example
        run: pnpm example:verify

      - name: Exercise reporter with parallel workers
        run: pnpm test:reporter:parallel

      - name: Run test suite
        run: pnpm test

      - name: Verify canonical Healwright evidence
        run: pnpm evidence:verify

      - name: Evaluate Healwright governance policy
        run: pnpm governance:evaluate

      - name: Upload Healwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: healwright-evidence
          path: |
            test-results/healwright/
            governance/policy.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

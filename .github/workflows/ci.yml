name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public package contracts
        run: pnpm package:check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Verify documentation links
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build package
        run: pnpm build

      - name: Verify package exports
        run: pnpm package:check

      - name: Install qualified browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify basic consumer example
        run: pnpm example:verify

      - name: Verify realistic evaluation-release demo
        run: pnpm example:realistic

      - name: Exercise reporter with parallel workers
        run: pnpm test:reporter:parallel

      - name: Run test suite
        run: pnpm test

      - name: Verify canonical Healwright evidence
        run: pnpm evidence:verify

      - name: Create evidence integrity manifest
        run: pnpm evidence:attest

      - name: Verify evidence integrity manifest
        run: pnpm evidence:manifest:verify

      - name: Evaluate Healwright governance policy
        run: pnpm governance:evaluate

      - name: Qualify Firefox and WebKit
        run: pnpm test:cross-browser

      - name: Upload Healwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: healwright-evidence
          path: |
            test-results/healwright/
            governance/policy.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  supply-chain:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Verify reproducible package
        run: pnpm package:reproducible

      - name: Prepare artifact directory
        run: mkdir -p test-results/supply-chain

      - name: Build package artifact
        run: pnpm pack --pack-destination test-results/supply-chain

      - name: Generate deterministic CycloneDX SBOM
        run: pnpm supply-chain:sbom

      - name: Verify deterministic CycloneDX SBOM
        run: pnpm supply-chain:sbom:check

      - name: Upload package and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: healwright-supply-chain
          path: |
            test-results/supply-chain/*.tgz
            test-results/supply-chain/sbom.cdx.json
          retention-days: 14

      - name: Attest package build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: test-results/supply-chain/*.tgz

      - name: Attest package SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: test-results/supply-chain/*.tgz
          sbom-path: test-results/supply-chain/sbom.cdx.json
